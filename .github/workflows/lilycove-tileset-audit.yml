name: Lilycove tileset audit

on:
  push:
    branches:
      - work/lilycove-route121-workspace
    paths:
      - ".github/workflows/lilycove-tileset-audit.yml"
      - "work/lilycove/tools/audit_tilesets.py"
      - "work/lilycove/asset-index.json"
      - "data/layouts/**"
      - "data/tilesets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only Lilycove audit
        run: python3 work/lilycove/tools/audit_tilesets.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: lilycove-tileset-audit
          path: work/lilycove/reports/tilesets/
          if-no-files-found: error
